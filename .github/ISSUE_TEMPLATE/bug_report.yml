name: Missed or false finding
description: A query pattern that is not reported, or a finding that should not be there
labels: [bug]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Missed finding (false negative)
        - Wrong finding (false positive)
        - Wrong severity or grouping
        - Crash or error
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: A minimal snippet with the entity mapping and the loop.
      render: php
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: The finding you expected, with its identifier, or none.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: The output you got.
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: PHP 8.4.x, PHPStan 2.1.x, phpstan-doctrine 2.0.x, Doctrine ORM 3.x, this package 0.4.0
    validations:
      required: true
